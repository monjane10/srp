<!doctype html>
<html lang="pt-MZ" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Um pequeno universo para ti</title>
  <meta name="description" content="Um pequeno universo criado especialmente para ti.">
  <meta name="theme-color" content="#292329">
  <!-- É um presente privado: pede aos motores de busca para não indexar. -->
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Fiz uma coisa para ti…">
  <meta property="og:description" content="Um pequeno universo criado especialmente para ti.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&family=Parisienne&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <script>document.documentElement.classList.replace("no-js", "js");</script>
</head>
<body>
  <noscript>
    <p class="noscript">Este presente precisa de JavaScript activado para abrir. Activa-o e volta a carregar a página.</p>
  </noscript>

  <div class="progress" aria-hidden="true"><span class="progress__bar"></span></div>

  <!-- ============ ECRÃ INICIAL ============ -->
  <section class="intro" id="intro" aria-labelledby="intro-title">
    <div class="stars" aria-hidden="true"></div>

    <div class="intro__inner">
      <div class="intro__text">
        <div class="seal" aria-hidden="true">
          <span class="seal__half seal__half--left"></span>
          <span class="seal__half seal__half--right"></span>
          <svg class="seal__icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        </div>
        <p class="intro__eyebrow" data-fill="intro.aviso"></p>
        <h1 class="intro__title" id="intro-title" data-fill="intro.titulo"></h1>
        <p class="intro__subtitle" data-fill="intro.subtitulo"></p>
        <button class="btn btn--primary intro__button" id="open-gift" type="button">
          <span data-fill="intro.botao"></span>
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="intro__arch">
        <div class="intro__photo media">
          <img id="intro-photo" alt="" decoding="async" fetchpriority="high">
        </div>
      </div>
    </div>
  </section>

  <!-- ============ NAVEGAÇÃO DISCRETA ============ -->
  <nav class="chapters" aria-label="Secções do presente">
    <a class="chapters__link" href="#abertura" data-label="Abertura"><span class="sr-only">Abertura</span></a>
    <a class="chapters__link" href="#galeria" data-label="Galeria"><span class="sr-only">Galeria</span></a>
    <a class="chapters__link" href="#carta" data-label="Carta"><span class="sr-only">Carta</span></a>
    <a class="chapters__link" href="#gosto" data-label="O que gosto em ti"><span class="sr-only">O que gosto em ti</span></a>
    <a class="chapters__link" href="#surpresa" data-label="Surpresa"><span class="sr-only">Surpresa</span></a>
  </nav>

  <main class="experience" id="conteudo">

    <!-- ============ ABERTURA ============ -->
    <section class="section opening" id="abertura" aria-labelledby="opening-title">
      <div class="opening__inner">
        <p class="opening__dedication enter" data-fill="abertura.dedicatoria"></p>
        <h2 class="opening__title enter" id="opening-title" tabindex="-1" data-fill="abertura.titulo"></h2>
        <p class="opening__text enter" data-fill="abertura.texto"></p>
        <a class="scroll-cue enter" href="#galeria">
          <span>Começar</span>
          <span class="scroll-cue__line" aria-hidden="true"></span>
        </a>
      </div>
    </section>

    <!-- ============ GALERIA ============ -->
    <section class="section gallery-section" id="galeria" aria-labelledby="gallery-title">
      <header class="section__header" data-reveal>
        <p class="section__number">I</p>
        <h2 class="section__title" id="gallery-title" data-fill="galeria.titulo"></h2>
        <p class="section__lead" data-fill="galeria.subtitulo"></p>
      </header>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- ============ CARTA ============ -->
    <section class="section letter-section" id="carta" aria-labelledby="letter-title">
      <header class="section__header section__header--center" data-reveal>
        <p class="section__number">II</p>
        <h2 class="section__title" id="letter-title" data-fill="carta.titulo"></h2>
      </header>

      <article class="letter" data-reveal>
        <p class="letter__greeting" data-fill="carta.saudacao"></p>
        <div class="letter__body" id="letter-body"></div>
        <footer class="letter__closing">
          <p data-fill="carta.despedida"></p>
          <p class="letter__signature" id="letter-signature"></p>
        </footer>
      </article>
    </section>

    <!-- ============ O QUE GOSTO EM TI ============ -->
    <section class="section likes" id="gosto" aria-labelledby="likes-title">
      <header class="section__header section__header--center" data-reveal>
        <p class="section__number">III</p>
        <h2 class="section__title" id="likes-title" data-fill="gosto.titulo"></h2>
        <p class="section__lead" data-fill="gosto.subtitulo"></p>
      </header>

      <div class="likes__card" data-reveal>
        <span class="likes__quote" aria-hidden="true">“</span>
        <p class="likes__message is-placeholder" id="likes-message" aria-live="polite">…</p>
        <p class="likes__count" id="likes-count" aria-hidden="true"></p>
      </div>
      <div class="likes__dots" id="likes-dots" aria-hidden="true"></div>
      <div class="likes__actions" data-reveal>
        <button class="btn btn--primary" id="likes-button" type="button"></button>
      </div>
    </section>

    <!-- ============ SURPRESA ============ -->
    <section class="section surprise" id="surpresa" aria-labelledby="surprise-title">
      <div class="stars" aria-hidden="true"></div>
      <canvas class="surprise__petals" id="petals" aria-hidden="true"></canvas>

      <div class="surprise__inner">
        <header class="section__header section__header--center" data-reveal>
          <p class="section__number">IV</p>
          <h2 class="section__title" id="surprise-title" data-fill="surpresa.titulo"></h2>
          <p class="section__lead" data-fill="surpresa.subtitulo"></p>
        </header>

        <div class="surprise__actions" data-reveal>
          <button class="btn btn--light" id="surprise-button" type="button">
            <span data-fill="surpresa.botao"></span>
          </button>
        </div>

        <div class="surprise__reveal" id="surprise-reveal" tabindex="-1" hidden>
          <svg class="surprise__heart" viewBox="0 0 48 44" aria-hidden="true">
            <path d="M24 41S3 28.6 3 14.5A10.5 10.5 0 0 1 24 9.3a10.5 10.5 0 0 1 21 5.2C45 28.6 24 41 24 41z"/>
          </svg>
          <div class="surprise__message" id="surprise-message"></div>
          <p class="surprise__note" data-fill="surpresa.notaFinal"></p>
          <a class="surprise__top" href="#abertura">Voltar ao início</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <!-- ============ MÚSICA ============ -->
  <button class="music" id="music-toggle" type="button" aria-pressed="false" hidden>
    <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="music__text">
      <span class="music__label" id="music-label">Música</span>
      <span class="music__state" id="music-state">em pausa · tocar</span>
    </span>
  </button>
  <audio id="music" preload="none" loop></audio>

  <!-- ============ FOTOGRAFIA AMPLIADA ============ -->
  <dialog class="lightbox" id="lightbox" aria-label="Fotografia ampliada">
    <figure class="lightbox__figure">
      <img class="lightbox__img" id="lightbox-img" alt="">
      <figcaption class="lightbox__caption">
        <span id="lightbox-caption"></span>
        <span class="lightbox__count" id="lightbox-count"></span>
      </figcaption>
    </figure>
    <button class="icon-btn lightbox__close" id="lightbox-close" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="icon-btn lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="Fotografia anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="Fotografia seguinte">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
